syntax = "proto3";

package ruoyu.study.questionbank.v1;

option csharp_namespace = "Ruoyu.Study.QuestionBank.Contract.Protos";

// ========== 通用请求/响应 ==========
message IdRequest {
  string id = 1;
}

message BoolResponse {
  bool success = 1;
  optional string error_message = 2;
}

message PageMeta {
  int32 page = 1;
  int32 size = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
}

// ========== 知识点 DTO ==========
message KnowledgeDto {
  string id = 1;
  string parent_id = 2;
  string name = 3;
  string description = 4;
  string created_by = 5;
  string created_at = 6;
  bool is_referenced = 7;
  int32 subject = 8;
  int32 grade = 9;
  string updated_by = 10;
  string updated_at = 11;
}

// ========== 题目内容 DTO ==========
message QuestionContentDto {
  string content = 1;
  string correct_answer = 2;
  string analysis = 3;
}

// ========== 题目 DTO ==========
message QuestionDto {
  string id = 1;
  string created_at = 2;
  string updated_at = 3;
  int32 level = 4;
  int32 type = 5;
  int32 width = 6;
  int32 height = 7;
  repeated bytes pictures = 8;     // 支持多图片
  repeated string picture_paths = 9;  // 图片存储路径列表 (JSON array)
  string user_id = 11;
  string student_id = 12;
  string mistake_id = 13;
  int32 subject = 14;
  int32 grade = 15;
  string content = 16;
  string correct_answer = 17;
  string analysis = 18;
}

// ========== 题目-知识点关联 DTO ==========
message QuestionKnowledgeDto {
  string id = 1;
  string question_id = 2;
  string knowledge_id = 3;
  double weight = 4;
  int32 subject = 5;
  int32 grade = 6;
}

// ========== 列表响应 ==========
message QuestionDtoList {
  repeated QuestionDto questions = 1;
}

message KnowledgeDtoList {
  repeated KnowledgeDto knowledges = 1;
}

message QuestionKnowledgeDtoList {
  repeated QuestionKnowledgeDto relations = 1;
}

message StringList {
  repeated string items = 1;
}

// ========== 分页响应 ==========
message QuestionPageResult {
  repeated QuestionDto items = 1;
  int32 total_page = 2;
  int32 total_count = 3;
}

message KnowledgePageResult {
  repeated KnowledgeDto items = 1;
  int32 total_page = 2;
  int32 total_count = 3;
}

// ========== 生词相关 ==========
message ExtractedWord {
  string word = 1;
  string part_of_speech = 2;
  string meaning = 3;
  int32 frequency = 4;
  double confidence = 5;
}

message SourceSentence {
  string sentence = 1;
  string source = 2;
  string context = 3;
}
