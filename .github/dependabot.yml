version: 2

updates:
  - package-ecosystem: nuget
    directory: /src
    schedule:
      interval: weekly
    # Only minor and patch updates are grouped; each major update gets its own PR so breaking changes are reviewed one at a time.
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Their next major lines require the next TFM; move them together with a deliberate runtime upgrade.
      - dependency-name: "Microsoft.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Npgsql*"
        update-types:
          - version-update:semver-major
      # FluentAssertions 8+ is licensed under the commercial Xceed license; stay on the Apache-2.0 7.x line.
      - dependency-name: "FluentAssertions"
        versions:
          - ">= 8.0.0"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Runtime majors move deliberately: .NET together with the TFM, Node to the next even-numbered LTS line.
    ignore:
      - dependency-name: "*dotnet/sdk"
        update-types:
          - version-update:semver-major
      - dependency-name: "*dotnet/aspnet"
        update-types:
          - version-update:semver-major
      - dependency-name: "*node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
